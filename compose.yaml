services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 90s
    develop:
      watch:
        - action: rebuild
          path: .
          include:
            - "*.go"
            - go.mod
            - go.sum
            - routes.txt
            - Dockerfile
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
