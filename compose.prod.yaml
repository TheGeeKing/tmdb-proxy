services:
  relay:
    image: ${RELAY_IMAGE:-ghcr.io/thegeeking/tmdb-proxy:1}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 64
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  valkey:
    image: valkey/valkey:8-alpine
    user: valkey
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
