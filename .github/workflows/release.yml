name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          release-type: go
          include-component-in-tag: false

  release:
    needs: release-please
    if: always() && (startsWith(github.ref, 'refs/tags/') || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Validate version tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo 'Expected a version tag such as v1.0.0 or v1.1.0-rc.1'
            exit 1
          }
      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Build release assets
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              filename="tmdb-relay_${RELEASE_TAG}_${os}_${arch}"
              if [[ "$os" == windows ]]; then filename+='.exe'; fi
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/$filename" .
            done
          done
          cp .env.example dist/env.example
          cp compose.prod.yaml dist/compose.prod.yaml
          (cd dist && sha256sum -- * > checksums.txt)
      - name: Container image tags
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          {
            echo 'tags<<EOF'
            echo "$image:$version"
            if [[ "$version" != *-* ]]; then
              echo "$image:${version%.*}"
              echo "$image:${version%%.*}"
              echo "$image:latest"
            fi
            echo EOF
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
        run: |
          if [[ "$RELEASE_CREATED" == true ]]; then
            gh release upload "$RELEASE_TAG" dist/*
            exit 0
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --generate-notes --title "tmdb-relay $RELEASE_TAG" "${flags[@]}"
