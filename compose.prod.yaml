services:
  relay:
    image: ${RELAY_IMAGE:-ghcr.io/thegeeking/tmdb-proxy:1}
    restart: unless-stopped
    environment:
      TMDB_READ_ACCESS_TOKEN: "${TMDB_READ_ACCESS_TOKEN:?Set TMDB_READ_ACCESS_TOKEN in the stack environment}"
      VALKEY_URL: "${VALKEY_URL:-}"
      TMDB_API_VERSIONS: "${TMDB_API_VERSIONS:-}"
      CACHE_TTL_DETAILS_SECONDS: "${CACHE_TTL_DETAILS_SECONDS:-}"
      CACHE_TTL_SEARCH_SECONDS: "${CACHE_TTL_SEARCH_SECONDS:-}"
      CACHE_TTL_LISTS_SECONDS: "${CACHE_TTL_LISTS_SECONDS:-}"
      CACHE_TTL_TRENDING_SECONDS: "${CACHE_TTL_TRENDING_SECONDS:-}"
      CACHE_TTL_REFERENCE_SECONDS: "${CACHE_TTL_REFERENCE_SECONDS:-}"
      TMDB_TIMEOUT_SECONDS: "${TMDB_TIMEOUT_SECONDS:-}"
      VALKEY_TIMEOUT_SECONDS: "${VALKEY_TIMEOUT_SECONDS:-}"
      MAX_RESPONSE_BYTES: "${MAX_RESPONSE_BYTES:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      LOG_LEVEL: "${LOG_LEVEL:-}"
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 64
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 3s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  valkey:
    image: valkey/valkey:8-alpine
    user: valkey
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
